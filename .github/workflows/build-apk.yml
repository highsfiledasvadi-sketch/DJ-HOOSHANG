name: Build DJ HOOSHANG V5.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "DJ_HOOSHANG_V5_2_Source-1/settings.gradle" ] || [ -f "DJ_HOOSHANG_V5_2_Source-1/settings.gradle.kts" ]; then
            echo "dir=DJ_HOOSHANG_V5_2_Source-1" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: settings.gradle was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-HOOSHANG-V5.2-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
